name: Battle core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  replays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the battle core and simulator
        run: dotnet build tools/BattleSim -c Release
      - name: The same seed always gives the same fight
        run: |
          dotnet tools/BattleSim/bin/Release/net8.0/BattleSim.dll --fingerprint 1000 > a.txt
          dotnet tools/BattleSim/bin/Release/net8.0/BattleSim.dll --fingerprint 1000 > b.txt
          cmp a.txt b.txt
          echo "$(wc -l < a.txt) fights replayed identically"
      - name: The balance report runs
        run: dotnet tools/BattleSim/bin/Release/net8.0/BattleSim.dll --out report.md
      - name: The progression simulator runs (60 days, 1 player per type)
        run: dotnet run --project tools/ProgressionSim -c Release -- --days 60 --seeds 1 --out progression.md
