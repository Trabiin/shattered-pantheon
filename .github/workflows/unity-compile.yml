name: Unity compile

# Compiles the game scripts against the real Unity 6.3 libraries, plays the screens on a stand-in
# for Unity, and tests the save file and the campaign order. No Unity licence is needed: nothing here runs the Unity editor.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Get the Unity 6.3 libraries from the newest editor image
        run: |
          TAG=$(curl -s "https://hub.docker.com/v2/repositories/unityci/editor/tags?page_size=100&name=ubuntu-6000.3" | jq -r '.results[].name' | grep -E '^ubuntu-6000\.3\.[0-9]+f[0-9]+-base-[0-9.]+$' | sort -V | tail -1)
          echo "Unity image: $TAG"
          # Docker Hub sometimes times out; try the pull a few times before giving up.
          for n in 1 2 3 4 5; do docker pull -q unityci/editor:$TAG && break; [ $n = 5 ] && exit 1; sleep $((n * 20)); done
          id=$(docker create unityci/editor:$TAG)
          mkdir -p unity-data
          docker cp $id:/opt/unity/Editor/Data/Managed unity-data/Managed
          ui=$(docker run --rm unityci/editor:$TAG bash -c 'ls /opt/unity/Editor/Data/Resources/PackageManager/ProjectTemplates/libcache/*/ScriptAssemblies/UnityEngine.UI.dll | head -1')
          docker cp "$id:$ui" unity-data/UnityEngine.UI.dll
          docker run --rm unityci/editor:$TAG cat /opt/unity/Editor/Data/Resources/PackageManager/BuiltInPackages/com.unity.ugui/package.json | jq -r '"Built-in ugui version: " + .version'
          docker rm $id
      - name: Compile game scripts (player build, no editor code)
        run: dotnet build tools/UnityCompileCheck -p:UnityData=$PWD/unity-data -p:WithEditor=false -o out/player
      - name: Compile game and editor scripts
        run: dotnet build tools/UnityCompileCheck -p:UnityData=$PWD/unity-data -p:WithEditor=true -o out/editor
      - name: Play the battle screen on a stand-in for Unity
        run: dotnet run --project tools/ScreenSmokeTest
      - name: Test the save file
        run: dotnet run --project tools/SaveTests
      - name: Test the order campaign battles open in
        run: dotnet run --project tools/CampaignTests
